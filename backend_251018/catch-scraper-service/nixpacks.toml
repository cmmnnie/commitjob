[phases.setup]
aptPkgs = [
    "chromium",
    "chromium-driver",
    "fonts-liberation",
    "libnss3",
    "libxss1",
    "libappindicator3-1",
    "libasound2",
    "libatk-bridge2.0-0",
    "libatk1.0-0",
    "libcups2",
    "libdbus-1-3",
    "libdrm2",
    "libgbm1",
    "libgtk-3-0",
    "libnspr4",
    "libu2f-udev",
    "libvulkan1",
    "xdg-utils"
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python -u catch_scraper.py"
