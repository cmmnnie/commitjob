# Railway Build Optimization v7 - Node.js only (Python scraping moved to external service)
[phases.setup]
nixPkgs = [
  "nodejs_18"
]

[phases.install]
cmds = [
  "npm ci --omit=dev --prefer-offline --no-audit --no-fund"
]

[phases.build]
# Skip build phase - no compilation needed
cmds = ["echo 'Build skipped'"]

[start]
cmd = "node server.js"
