# Railway Build Optimization v6 - Node.js + Python (Selenium scraping via nixPkgs)
[phases.setup]
nixPkgs = [
  "nodejs_18",
  "python311",
  "python311Packages.selenium",
  "python311Packages.pymysql",
  "python311Packages.python-dotenv"
]

[phases.install]
cmds = [
  "npm ci --omit=dev --prefer-offline --no-audit --no-fund",
  "pip install webdriver-manager --break-system-packages --no-cache-dir"
]

[phases.build]
# Skip build phase - no compilation needed
cmds = ["echo 'Build skipped'"]

[start]
cmd = "node server.js"
