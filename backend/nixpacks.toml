# Railway Build Optimization v8 - Node.js with Puppeteer support
[phases.setup]
nixPkgs = [
  "nodejs_18",
  "chromium"
]
nixPkgsLibs = [
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "libdrm",
  "expat",
  "libxcb",
  "libxkbcommon",
  "libx11",
  "libxcomposite",
  "libxdamage",
  "libxext",
  "libxfixes",
  "libxrandr",
  "mesa",
  "gtk3",
  "pango",
  "cairo",
  "cups",
  "dbus",
  "at-spi2-core",
  "libxshmfence",
  "alsa-lib"
]

[phases.install]
cmds = [
  "npm ci --omit=dev --prefer-offline --no-audit --no-fund"
]

[phases.build]
# Skip build phase - no compilation needed
cmds = ["echo 'Build skipped'"]

[start]
cmd = "node server.js"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "chromium"
