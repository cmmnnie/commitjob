# Railway Build Optimization v3 - Node.js + Python
[phases.setup]
nixPkgs = ["nodejs_18", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "npm ci --omit=dev --prefer-offline --no-audit --no-fund",
  "pip install --break-system-packages selenium==4.15.2 flask==3.0.0 flask-cors==4.0.0 SQLAlchemy==2.0.32 PyMySQL==1.1.1"
]

[phases.build]
# Skip build phase - no compilation needed for Node.js
cmds = ["echo 'Build skipped'"]

[start]
cmd = "node server.js"
